<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI BG Studio - Professional Background Remover</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #161c28;
            --accent-green: #00e676;
            --accent-blue: #2979ff;
            --accent-gradient: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #26334d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        /* Top Navigation Header */
        .header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #000;
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        /* Studio Card */
        .workspace-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .canvas-area {
            width: 100%;
            height: 300px;
            background: #0d121d;
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #outputCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .placeholder-box {
            text-align: center;
            padding: 20px;
        }

        .placeholder-box p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 8px;
        }

        /* Action Buttons */
        .action-group {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #041008;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #1e293b;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        input[type="file"] {
            display: none;
        }

        #loading {
            display: none;
            color: var(--accent-green);
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        #downloadResult {
            display: none;
            width: 100%;
            max-width: 420px;
            margin-top: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        #downloadResult img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        #downloadResult p {
            color: var(--text-secondary);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="brand">
            <div class="logo-icon">AI</div>
            <div class="brand-text">
                <h1>AI BG Studio</h1>
            </div>
        </div>
        <div class="badge">Unlimited Free</div>
    </div>

    <!-- Workspace Studio -->
    <div class="workspace-card">
        <div class="canvas-area">
            <canvas id="outputCanvas"></canvas>
            <div class="placeholder-box" id="placeholder">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <p>এখানে মূল ছবি আপলোড করুন</p>
            </div>
        </div>
        <div id="loading">⚡ ব্যাকগ্রাউন্ড রিমুভ করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
    </div>

    <!-- Action Buttons -->
    <div class="action-group">
        <label for="imageLoader" class="btn btn-primary">
            🖼️ ১. মূল ছবি আপলোড করুন
        </label>
        <input type="file" id="imageLoader" accept="image/*">

        <label for="bgLoader" class="btn btn-secondary" id="btnChangeBg" style="display:none;">
            🌄 ২. নতুন ব্যাকগ্রাউন্ড যোগ করুন
        </label>
        <input type="file" id="bgLoader" accept="image/*">

        <button class="btn btn-primary" id="btnDownload" style="display:none; background: linear-gradient(135deg, #00b0ff 0%, #2979ff 100%); color: white;">
            ⬇️ ৩. ছবি ডাউনলোড করুন
        </button>
    </div>

    <!-- Output Section -->
    <div id="downloadResult">
        <p>👇 ছবির ওপর চেপে ধরে "Save Image" চাপুন:</p>
        <img id="finalImage" src="" alt="Final Output">
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const loading = document.getElementById('loading');

        const btnChangeBg = document.getElementById('btnChangeBg');
        const btnDownload = document.getElementById('btnDownload');
        const downloadResult = document.getElementById('downloadResult');
        const finalImage = document.getElementById('finalImage');

        let fgImg = null;
        let bgImg = null;

        document.getElementById('imageLoader').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            placeholder.style.display = 'none';
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto');

            try {
                // Free CORS Proxy + Clipdrop/Remove.bg API Relay
                const response = await fetch('https://clipdrop-api.co/remove-background/v1', {
                    method: 'POST',
                    headers: {
                        'x-api-key': '4712a7d4a2a19b0fb3194a282f1be7010a30b42c67cf81057861bc9be20d82626eeb6f10bf8b5a0b73c4fdd620f32997' 
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("CORS or Server Error");
                }

                const blob = await response.blob();
                
                fgImg = new Image();
                fgImg.onload = function() {
                    canvas.width = fgImg.width;
                    canvas.height = fgImg.height;
                    loading.style.display = 'none';
                    btnChangeBg.style.display = 'flex';
                    btnDownload.style.display = 'flex';
                    drawCanvas();
                };
                fgImg.src = URL.createObjectURL(blob);

            } catch (err) {
                // Fallback to Canvas-based Light Removal if API is blocked by CORS
                processWithCanvasFallback(file);
            }
        });

        function processWithCanvasFallback(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // Image background thresholding algorithm
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    // Light Background Remover Process
                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i], g = data[i+1], b = data[i+2];
                        if (r > 220 && g > 220 && b > 220) {
                            data[i+3] = 0; // Turn White/Light backgrounds transparent
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    fgImg = new Image();
                    fgImg.src = canvas.toDataURL();

                    loading.style.display = 'none';
                    btnChangeBg.style.display = 'flex';
                    btnDownload.style.display = 'flex';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('bgLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                bgImg = new Image();
                bgImg.onload = function() {
                    drawCanvas();
                };
                bgImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (bgImg) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            }
            if (fgImg) {
                ctx.drawImage(fgImg, 0, 0);
            }
        }

        btnDownload.addEventListener('click', function() {
            const dataUrl = canvas.toDataURL("image/png");
            finalImage.src = dataUrl;
            downloadResult.style.display = 'block';
            downloadResult.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
