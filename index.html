<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI BG Changer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h2 { color: #4CAF50; margin-bottom: 5px; }
        p.subtitle { color: #aaa; font-size: 13px; margin-bottom: 20px; }

        .canvas-container {
            width: 100%;
            max-width: 350px;
            height: 280px;
            background-color: #1e1e1e;
            border: 2px dashed #444;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #outputCanvas { max-width: 100%; max-height: 100%; }
        .placeholder-text { color: #777; font-size: 14px; text-align: center; }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-blue { background-color: #0088cc; }
        input[type="file"] { display: none; }
        #loading { display: none; color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

    <h2>AI BG Changer</h2>
    <p class="subtitle">মুহূর্তেই ব্যাকগ্রাউন্ড সরান ও নতুন ব্যাকগ্রাউন্ড দিন!</p>

    <div class="canvas-container">
        <canvas id="outputCanvas"></canvas>
        <div class="placeholder-text" id="placeholder">ছবি আপলোড করুন</div>
        <div id="loading">প্রসেসিং হচ্ছে, ১ সেকেন্ড অপেক্ষা করুন...</div>
    </div>

    <label for="imageLoader" class="btn">🖼️ ১. মূল ছবি আপলোড করুন</label>
    <input type="file" id="imageLoader" accept="image/*">

    <label for="bgLoader" class="btn btn-blue" id="btnChangeBg" style="display:none;">🌄 ২. নতুন ব্যাকগ্রাউন্ড যোগ করুন</label>
    <input type="file" id="bgLoader" accept="image/*">

    <button class="btn btn-blue" id="btnDownload" style="display:none;">⬇️ ৩. ডাউনলোড করুন</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ আপনার Clipdrop API Key টি নিচে বসান
        const CLIPDROP_API_KEY = "YOUR_CLIPDROP_API_KEY_HERE";

        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const loading = document.getElementById('loading');

        const btnChangeBg = document.getElementById('btnChangeBg');
        const btnDownload = document.getElementById('btnDownload');

        let fgImage = null;
        let bgImage = null;

        document.getElementById('imageLoader').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            placeholder.style.display = 'none';
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('image_file', file);

            try {
                const response = await fetch('https://clipdrop-api.co/remove-background/v1', {
                    method: 'POST',
                    headers: { 'x-api-key': CLIPDROP_API_KEY },
                    body: formData,
                });

                if (!response.ok) throw new Error('API লিমিট বা কি-তে সমস্যা');

                const buffer = await response.arrayBuffer();
                const blob = new Blob([buffer], { type: 'image/png' });
                
                fgImage = new Image();
                fgImage.onload = function() {
                    canvas.width = fgImage.width;
                    canvas.height = fgImage.height;
                    loading.style.display = 'none';
                    btnChangeBg.style.display = 'block';
                    btnDownload.style.display = 'block';
                    renderCanvas();
                };
                fgImage.src = URL.createObjectURL(blob);

            } catch (err) {
                loading.style.display = 'none';
                placeholder.style.display = 'block';
                tg.showAlert("সমস্যা হয়েছে! API Key টি সঠিকভাবে বসানো হয়েছে কি না দেখুন।");
            }
        });

        document.getElementById('bgLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            bgImage = new Image();
            bgImage.onload = function() {
                renderCanvas();
            };
            bgImage.src = URL.createObjectURL(file);
        });

        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (bgImage) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }
            if (fgImage) {
                ctx.drawImage(fgImage, 0, 0);
            }
        }

        btnDownload.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'bg_removed.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
