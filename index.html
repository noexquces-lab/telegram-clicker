            <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI BG Changer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h2 { color: #4CAF50; margin-bottom: 5px; }
        p.subtitle { color: #aaa; font-size: 13px; margin-bottom: 20px; text-align: center; }

        .canvas-container {
            width: 100%;
            max-width: 350px;
            height: 280px;
            background-color: #1e1e1e;
            border: 2px dashed #444;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #outputCanvas { max-width: 100%; max-height: 100%; }
        .placeholder-text { color: #777; font-size: 14px; text-align: center; }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-blue { background-color: #0088cc; }
        input[type="file"] { display: none; }
        #loading { display: none; color: #00e676; font-weight: bold; text-align: center; padding: 10px; }
    </style>
</head>
<body>

    <h2>AI BG Changer</h2>
    <p class="subtitle">AI এর মাধ্যমে ব্যাকগ্রাউন্ড সরান ও নতুন রূপ দিন!</p>

    <div class="canvas-container">
        <canvas id="outputCanvas"></canvas>
        <div class="placeholder-text" id="placeholder">১. মূল ছবি আপলোড করুন</div>
    </div>

    <div id="loading">AI প্রক্রিয়াকরণ হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>

    <label for="imageLoader" class="btn">🖼️ ১. মূল ছবি আপলোড করুন</label>
    <input type="file" id="imageLoader" accept="image/*">

    <label for="bgLoader" class="btn btn-blue" id="btnChangeBg" style="display:none;">🌄 ২. নতুন ব্যাকগ্রাউন্ড দিন</label>
    <input type="file" id="bgLoader" accept="image/*">

    <button class="btn btn-blue" id="btnDownload" style="display:none;">⬇️ ৩. ডাউনলোড / সেভ করুন</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const CLIPDROP_API_KEY = "B2169a7131ab6e299c01ddd87ac96425da71d7eac2d8d542e1bcc1a09077a944c69997a36e167ba3b4de31e00a7709ce";

        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const loading = document.getElementById('loading');

        const btnChangeBg = document.getElementById('btnChangeBg');
        const btnDownload = document.getElementById('btnDownload');

        let fgImg = null;
        let bgImg = null;

        document.getElementById('imageLoader').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            placeholder.style.display = 'none';
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('image_file', file);

            // CORS প্রোফাইল দিয়ে API কল করা হচ্ছে
            const targetUrl = 'https://clipdrop-api.co/remove-background/v1';
            const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

            try {
                let response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'x-api-key': CLIPDROP_API_KEY },
                    body: formData,
                });

                // ব্যাকআপ প্রক্সি ট্রাই করা হচ্ছে যদি ১ম প্রক্সি ফেল করে
                if (!response.ok) {
                    const fallbackProxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
                    response = await fetch(fallbackProxy, {
                        method: 'POST',
                        headers: { 'x-api-key': CLIPDROP_API_KEY },
                        body: formData,
                    });
                }

                if (!response.ok) throw new Error('API/Proxy Error');

                const buffer = await response.arrayBuffer();
                const blob = new Blob([buffer], { type: 'image/png' });

                fgImg = new Image();
                fgImg.onload = function() {
                    canvas.width = fgImg.width;
                    canvas.height = fgImg.height;
                    loading.style.display = 'none';
                    btnChangeBg.style.display = 'block';
                    btnDownload.style.display = 'block';
                    drawCanvas();
                };
                fgImg.src = URL.createObjectURL(blob);

            } catch (err) {
                loading.style.display = 'none';
                placeholder.style.display = 'block';
                tg.showAlert("নেটওয়ার্ক বা ব্রাউজার ব্লকের কারণে ব্যাকগ্রাউন্ড সরানো যায়নি। আবার চেষ্টা করুন।");
            }
        });

        document.getElementById('bgLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            bgImg = new Image();
            bgImg.onload = function() {
                drawCanvas();
            };
            bgImg.src = URL.createObjectURL(file);
        });

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (bgImg) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            }
            if (fgImg) {
                ctx.drawImage(fgImg, 0, 0);
            }
        }

        // ছবি ডাউনলোডের স্থায়ী সমাধান
        btnDownload.addEventListener('click', function() {
            const dataUrl = canvas.toDataURL("image/png");
            
            // ডাউনলোড লিঙ্ক তৈরি
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'ai_bg_changed.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // টেলিগ্রাম ব্রাউজার না মানলে পপআপ
            setTimeout(() => {
                const imgWindow = window.open();
                if (imgWindow) {
                    imgWindow.document.write('<h3>ছবি সেভ করতে নিচে প্রেস করে রাখুন:</h3><img src="' + dataUrl + '" style="max-width:100%; height:auto;"/>');
                }
            }, 500);
        });
    </script>
</body>
</html>
