<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI BG Changer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h2 { color: #4CAF50; margin-bottom: 5px; }
        p.subtitle { color: #aaa; font-size: 13px; margin-bottom: 20px; text-align: center; }

        .canvas-container {
            width: 100%;
            max-width: 350px;
            height: 280px;
            background-color: #1e1e1e;
            border: 2px dashed #444;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #outputCanvas { max-width: 100%; max-height: 100%; }
        .placeholder-text { color: #777; font-size: 14px; text-align: center; }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-blue { background-color: #0088cc; }
        input[type="file"] { display: none; }
        #downloadResult { display: none; width: 100%; max-width: 350px; margin-top: 15px; text-align: center; }
        #downloadResult img { max-width: 100%; border-radius: 8px; border: 1px solid #4CAF50; }
        #downloadResult p { color: #ffca28; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>

    <h2>AI BG Changer</h2>
    <p class="subtitle">মুহূর্তেই ব্যাকগ্রাউন্ড পরিবর্তন ও নতুন ব্যাকগ্রাউন্ড যুক্ত করুন!</p>

    <div class="canvas-container">
        <canvas id="outputCanvas"></canvas>
        <div class="placeholder-text" id="placeholder">১. মূল ছবি আপলোড করুন</div>
    </div>

    <label for="imageLoader" class="btn">🖼️ ১. মূল ছবি আপলোড করুন</label>
    <input type="file" id="imageLoader" accept="image/*">

    <label for="bgLoader" class="btn btn-blue" id="btnChangeBg" style="display:none;">🌄 ২. নতুন ব্যাকগ্রাউন্ড দিন</label>
    <input type="file" id="bgLoader" accept="image/*">

    <button class="btn btn-blue" id="btnDownload" style="display:none;">⬇️ ৩. ছবি প্রস্তুত করুন</button>

    <div id="downloadResult">
        <p>👇 ছবির ওপর চেপে ধরে "Save Image" সিলেক্ট করে সেভ করুন:</p>
        <img id="finalImage" src="" alt="Final Output">
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');

        const btnChangeBg = document.getElementById('btnChangeBg');
        const btnDownload = document.getElementById('btnDownload');
        const downloadResult = document.getElementById('downloadResult');
        const finalImage = document.getElementById('finalImage');

        let fgImg = null;
        let bgImg = null;

        document.getElementById('imageLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                fgImg = new Image();
                fgImg.onload = function() {
                    canvas.width = fgImg.width;
                    canvas.height = fgImg.height;
                    placeholder.style.display = 'none';
                    btnChangeBg.style.display = 'block';
                    btnDownload.style.display = 'block';
                    removeBackgroundClientSide();
                };
                fgImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('bgLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                bgImg = new Image();
                bgImg.onload = function() {
                    drawCanvas();
                };
                bgImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ক্লায়েন্ট সাইড ব্যাকগ্রাউন্ড ফিল্টারিং
        function removeBackgroundClientSide() {
            ctx.drawImage(fgImg, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            // কর্নারের পিক্সেলের উপর ভিত্তি করে ব্যাকগ্রাউন্ড কালার ডিটেক্ট
            const bgR = data[0];
            const bgG = data[1];
            const bgB = data[2];

            const tolerance = 40;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                if (Math.abs(r - bgR) < tolerance &&
                    Math.abs(g - bgG) < tolerance &&
                    Math.abs(b - bgB) < tolerance) {
                    data[i + 3] = 0; // Transparent
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (bgImg) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            }
            if (fgImg) {
                ctx.drawImage(fgImg, 0, 0);
            }
        }

        // ইন-অ্যাপ ব্রাউজারে সরাসরি সেভ করার জন্য ইমেজ ভিউ প্রদান
        btnDownload.addEventListener('click', function() {
            const dataUrl = canvas.toDataURL("image/png");
            finalImage.src = dataUrl;
            downloadResult.style.display = 'block';
            downloadResult.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
