<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Easy BG Changer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h2 { color: #4CAF50; margin-bottom: 5px; }
        p.subtitle { color: #aaa; font-size: 13px; margin-bottom: 20px; }

        .canvas-container {
            width: 100%;
            max-width: 350px;
            height: 280px;
            background-color: #1e1e1e;
            border: 2px dashed #444;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #outputCanvas { max-width: 100%; max-height: 100%; }
        .placeholder-text { color: #777; font-size: 14px; text-align: center; }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-blue { background-color: #0088cc; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <h2>Photo Editor Mini App</h2>
    <p class="subtitle">সহজেই ছবিতে ব্যাকগ্রাউন্ড ও ফ্রেম যোগ করুন!</p>

    <div class="canvas-container">
        <canvas id="outputCanvas"></canvas>
        <div class="placeholder-text" id="placeholder">১. ছবি সিলেক্ট করুন</div>
    </div>

    <label for="imageLoader" class="btn">🖼️ ১. ছবি আপলোড করুন</label>
    <input type="file" id="imageLoader" accept="image/*">

    <label for="bgLoader" class="btn btn-blue" id="btnChangeBg" style="display:none;">🌄 ২. নতুন ব্যাকগ্রাউন্ড দিন</label>
    <input type="file" id="bgLoader" accept="image/*">

    <button class="btn btn-blue" id="btnDownload" style="display:none;">⬇️ ৩. ডাউনলোড করুন</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');

        const btnChangeBg = document.getElementById('btnChangeBg');
        const btnDownload = document.getElementById('btnDownload');

        let mainImg = null;
        let bgImg = null;

        document.getElementById('imageLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            mainImg = new Image();
            mainImg.onload = function() {
                canvas.width = mainImg.width;
                canvas.height = mainImg.height;
                placeholder.style.display = 'none';
                btnChangeBg.style.display = 'block';
                btnDownload.style.display = 'block';
                drawCanvas();
            };
            mainImg.src = URL.createObjectURL(file);
        });

        document.getElementById('bgLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            bgImg = new Image();
            bgImg.onload = function() {
                drawCanvas();
            };
            bgImg.src = URL.createObjectURL(file);
        });

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (bgImg) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            }
            if (mainImg) {
                if (bgImg) {
                    let padding = canvas.width * 0.08;
                    ctx.drawImage(mainImg, padding, padding, canvas.width - (padding * 2), canvas.height - (padding * 2));
                } else {
                    ctx.drawImage(mainImg, 0, 0);
                }
            }
        }

        btnDownload.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'edited_photo.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
